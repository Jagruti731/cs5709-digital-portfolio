<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img"><title>Control flow: posting to the community feed</title><style>.dg-box{fill:#F4F2EC;stroke:#1D1C19;stroke-width:1.4}.dg-box.dg-fill-a{fill:#DDE3D3;stroke:#3F5236}.dg-box.dg-fill-t{fill:#E7E4DC}.dg-box.dg-fill-i{fill:#1D1C19}.dg-box.dg-dashed{stroke-dasharray:5 4;fill:#F2F0EA}.dg-text{fill:#1D1C19;font:500 13.5px Georgia,'Times New Roman',serif}.dg-strong{font-weight:700}.dg-small{fill:#5F5C54;font:400 11.5px 'Courier New',monospace}.dg-on-ink{fill:#fff}.dg-line{fill:none;stroke:#5F5C54;stroke-width:1.5}.dg-dash{stroke-dasharray:5 4}.dg-arrowhead{fill:#5F5C54}.dg-label-bg{fill:#F4F2EC}.dg-group{fill:none;stroke:#BEB9AD;stroke-width:1.5;stroke-dasharray:4 4}.dg-group-label{fill:#3F5236;font:700 11px 'Courier New',monospace;letter-spacing:.05em}.dg-icon{fill:#F4F2EC;stroke:#1D1C19;stroke-width:1.1}</style><rect width="100%" height="100%" fill="#F4F2EC"/><defs><marker id="ah-post" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-arrowhead"/></marker></defs><rect x="290.0" y="12.0" width="380" height="44" rx="22.0" class="dg-box dg-fill-i"/><text x="480" y="39" class="dg-text dg-on-ink dg-strong" text-anchor="middle">Visitor writes a post (or likes / comments)</text><rect x="310" y="86" width="340" height="56" rx="4" class="dg-box "/><text x="480.0" y="109.5" class="dg-text dg-strong" text-anchor="middle">Build the post</text><text x="480.0" y="126.5" class="dg-small" text-anchor="middle">author · text · optional image (data URL)</text><polygon points="480,162.0 620.0,206 480,250.0 340.0,206" class="dg-box dg-fill-a"/><text x="480" y="203" class="dg-text dg-strong" text-anchor="middle">VITE_API_URL</text><text x="480" y="219" class="dg-text dg-strong" text-anchor="middle">set at build time?</text><rect x="60" y="280" width="320" height="56" rx="4" class="dg-box dg-fill-t"/><text x="220.0" y="303.5" class="dg-text dg-strong" text-anchor="middle">Local mode</text><text x="220.0" y="320.5" class="dg-small" text-anchor="middle">no network call</text><rect x="60" y="366" width="320" height="56" rx="4" class="dg-box "/><text x="220.0" y="397.0" class="dg-text dg-strong" text-anchor="middle">dispatch(addPost) to Redux</text><rect x="60" y="452" width="320" height="56" rx="4" class="dg-box "/><text x="220.0" y="475.5" class="dg-text dg-strong" text-anchor="middle">Feed effect saves to localStorage</text><text x="220.0" y="492.5" class="dg-small" text-anchor="middle">key postfeed.posts</text><rect x="580" y="280" width="320" height="56" rx="4" class="dg-box dg-fill-t"/><text x="740.0" y="303.5" class="dg-text dg-strong" text-anchor="middle">POST /posts with Bearer token</text><text x="740.0" y="320.5" class="dg-small" text-anchor="middle">server checks the session</text><polygon points="740,360.0 850.0,400 740,440.0 630.0,400" class="dg-box dg-fill-a"/><text x="740" y="397" class="dg-text dg-strong" text-anchor="middle">201</text><text x="740" y="413" class="dg-text dg-strong" text-anchor="middle">Created?</text><rect x="580" y="470" width="320" height="50" rx="4" class="dg-box "/><text x="740.0" y="498.0" class="dg-text dg-strong" text-anchor="middle">dispatch(addPost) with server post</text><rect x="660" y="540" width="240" height="44" rx="4" class="dg-box dg-fill-a"/><text x="780.0" y="565.0" class="dg-text dg-strong" text-anchor="middle">401 → &#x27;Sign in to post&#x27;</text><rect x="70.0" y="538.0" width="300" height="44" rx="22.0" class="dg-box dg-fill-i"/><text x="220" y="565" class="dg-text dg-on-ink dg-strong" text-anchor="middle">Feed re-renders newest first</text><polyline points="480,56.0 480.0,86" class="dg-line" marker-end="url(#ah-post)"/><polyline points="480.0,142 480,162.0" class="dg-line" marker-end="url(#ah-post)"/><polyline points="340.0,206 220,206 220.0,280" class="dg-line" marker-end="url(#ah-post)"/><rect x="287.8" y="181" width="24.4" height="16" class="dg-label-bg"/><text x="300" y="193" class="dg-small" text-anchor="middle">no</text><polyline points="220.0,336 220.0,366" class="dg-line" marker-end="url(#ah-post)"/><polyline points="220.0,422 220.0,452" class="dg-line" marker-end="url(#ah-post)"/><polyline points="220.0,508 220,538.0" class="dg-line" marker-end="url(#ah-post)"/><polyline points="620.0,206 740,206 740.0,280" class="dg-line" marker-end="url(#ah-post)"/><rect x="644.2" y="181" width="31.6" height="16" class="dg-label-bg"/><text x="660" y="193" class="dg-small" text-anchor="middle">yes</text><polyline points="740.0,336 740,360.0" class="dg-line" marker-end="url(#ah-post)"/><polyline points="630.0,400 560,400 560,495 580,495.0" class="dg-line" marker-end="url(#ah-post)"/><rect x="544.2" y="429" width="31.6" height="16" class="dg-label-bg"/><text x="560" y="441" class="dg-small" text-anchor="middle">yes</text><polyline points="850.0,400 930,400 930,562 900,562.0" class="dg-line" marker-end="url(#ah-post)"/><rect x="917.8" y="459" width="24.4" height="16" class="dg-label-bg"/><text x="930" y="471" class="dg-small" text-anchor="middle">no</text><polyline points="580,495.0 520,495 520,560 370.0,560" class="dg-line" marker-end="url(#ah-post)"/></svg>