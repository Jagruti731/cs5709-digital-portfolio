<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 316" width="960" height="316" role="img"><title>Phase 2 architecture</title><style>.dg-box{fill:#FFFFFF;stroke:#1C1F26;stroke-width:1.4}.dg-box.dg-fill-a{fill:#DBE6FD;stroke:#2563EB}.dg-box.dg-fill-t{fill:#EEF0F4}.dg-box.dg-fill-i{fill:#1C1F26}.dg-box.dg-dashed{stroke-dasharray:5 4;fill:#F4F5F7}.dg-text{fill:#1C1F26;font:500 13.5px Calibri,Carlito,Arial,sans-serif}.dg-strong{font-weight:700}.dg-small{fill:#5B6270;font:400 11.5px Calibri,Carlito,Arial,sans-serif}.dg-on-ink{fill:#fff}.dg-line{fill:none;stroke:#5B6270;stroke-width:1.5}.dg-dash{stroke-dasharray:5 4}.dg-arrowhead{fill:#5B6270}.dg-label-bg{fill:#FFFFFF}.dg-group{fill:none;stroke:#C9CED8;stroke-width:1.5;stroke-dasharray:4 4}.dg-group-label{fill:#2563EB;font:700 11px Calibri,Carlito,Arial,sans-serif;letter-spacing:.05em}.dg-icon{fill:#FFFFFF;stroke:#1C1F26;stroke-width:1.1}</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="ah-p2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-arrowhead"/></marker></defs><rect x="30" y="110" width="220" height="80" rx="4" class="dg-box dg-fill-a"/><text x="140.0" y="145.5" class="dg-text dg-strong" text-anchor="middle">React frontend</text><text x="140.0" y="162.5" class="dg-small" text-anchor="middle">version 1.0, extended</text><rect x="330" y="110" width="220" height="80" rx="4" class="dg-box dg-fill-t"/><text x="440.0" y="138.0" class="dg-text dg-strong" text-anchor="middle">Backend API</text><text x="440.0" y="155.0" class="dg-small" text-anchor="middle">Express → ASP.NET Core</text><text x="440.0" y="170.0" class="dg-small" text-anchor="middle">hosted in the cloud</text><rect x="630" y="30" width="300" height="64" rx="4" class="dg-box "/><text x="780.0" y="57.5" class="dg-text dg-strong" text-anchor="middle">Database</text><text x="780.0" y="74.5" class="dg-small" text-anchor="middle">replaces the JSON files</text><rect x="630" y="118" width="300" height="64" rx="4" class="dg-box "/><text x="780.0" y="145.5" class="dg-text dg-strong" text-anchor="middle">Authentication</text><text x="780.0" y="162.5" class="dg-small" text-anchor="middle">hashed passwords · admin role</text><rect x="630" y="206" width="300" height="64" rx="4" class="dg-box "/><text x="780.0" y="233.5" class="dg-text dg-strong" text-anchor="middle">Real-time hub</text><text x="780.0" y="250.5" class="dg-small" text-anchor="middle">WebSockets / SignalR chat</text><polyline points="250,150.0 330,150.0" class="dg-line" marker-end="url(#ah-p2)"/><rect x="241.8" y="139.0" width="96.4" height="16" class="dg-label-bg"/><text x="290.0" y="151.0" class="dg-small" text-anchor="middle">HTTPS / JSON</text><polyline points="550,150.0 590,150 590,62 630,62.0" class="dg-line" marker-end="url(#ah-p2)"/><polyline points="550,150.0 630,150.0" class="dg-line" marker-end="url(#ah-p2)"/><polyline points="590,150 590,238 630,238.0" class="dg-line" marker-end="url(#ah-p2)"/><text x="30" y="300" class="dg-small" text-anchor="start">Phase 2 features on this base: chat across devices, moderation, shared feed, CMS, tests in CI.</text></svg>