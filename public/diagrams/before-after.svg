<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img"><title>Before and after</title><style>.dg-box{fill:#FFFFFF;stroke:#1C1F26;stroke-width:1.4}.dg-box.dg-fill-a{fill:#DBE6FD;stroke:#2563EB}.dg-box.dg-fill-t{fill:#EEF0F4}.dg-box.dg-fill-i{fill:#1C1F26}.dg-box.dg-dashed{stroke-dasharray:5 4;fill:#F4F5F7}.dg-text{fill:#1C1F26;font:500 13.5px Calibri,Carlito,Arial,sans-serif}.dg-strong{font-weight:700}.dg-small{fill:#5B6270;font:400 11.5px Calibri,Carlito,Arial,sans-serif}.dg-on-ink{fill:#fff}.dg-line{fill:none;stroke:#5B6270;stroke-width:1.5}.dg-dash{stroke-dasharray:5 4}.dg-arrowhead{fill:#5B6270}.dg-label-bg{fill:#FFFFFF}.dg-group{fill:none;stroke:#C9CED8;stroke-width:1.5;stroke-dasharray:4 4}.dg-group-label{fill:#2563EB;font:700 11px Calibri,Carlito,Arial,sans-serif;letter-spacing:.05em}.dg-icon{fill:#FFFFFF;stroke:#1C1F26;stroke-width:1.1}</style><rect width="100%" height="100%" fill="#FFFFFF"/><defs><marker id="ah-ba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-arrowhead"/></marker></defs><rect x="16" y="16" width="440" height="298" rx="6" class="dg-group"/><text x="28" y="36" class="dg-group-label" text-anchor="start">VERSION 0 (STARTER)</text><rect x="504" y="16" width="440" height="298" rx="6" class="dg-group"/><text x="516" y="36" class="dg-group-label" text-anchor="start">VERSION 1.0</text><rect x="36" y="56" width="400" height="52" rx="4" class="dg-box dg-fill-a"/><text x="236.0" y="77.5" class="dg-text dg-strong" text-anchor="middle">App.tsx</text><text x="236.0" y="94.5" class="dg-small" text-anchor="middle">useState&lt;PageType&gt;(&#x27;post&#x27;)</text><rect x="36" y="138" width="400" height="52" rx="4" class="dg-box "/><text x="236.0" y="159.5" class="dg-text dg-strong" text-anchor="middle">switch (currentPage)</text><text x="236.0" y="176.5" class="dg-small" text-anchor="middle">no URL · refresh → Post Feed</text><rect x="36" y="220" width="400" height="74" rx="4" class="dg-box "/><text x="236.0" y="245.0" class="dg-text dg-strong" text-anchor="middle">12 page components</text><text x="236.0" y="262.0" class="dg-small" text-anchor="middle">content hard-coded inside each</text><text x="236.0" y="277.0" class="dg-small" text-anchor="middle">Blog unreachable from the menu</text><polyline points="236.0,108 236.0,138" class="dg-line" marker-end="url(#ah-ba)"/><polyline points="236.0,190 236.0,220" class="dg-line" marker-end="url(#ah-ba)"/><rect x="524" y="56" width="400" height="52" rx="4" class="dg-box dg-fill-a"/><text x="724.0" y="77.5" class="dg-text dg-strong" text-anchor="middle">HashRouter + routes.tsx</text><text x="724.0" y="94.5" class="dg-small" text-anchor="middle">/#/about · /#/blog · … · *</text><rect x="524" y="138" width="400" height="52" rx="4" class="dg-box "/><text x="724.0" y="159.5" class="dg-text dg-strong" text-anchor="middle">Layout</text><text x="724.0" y="176.5" class="dg-small" text-anchor="middle">Navbar · Outlet · Footer</text><rect x="524" y="220" width="190" height="74" rx="4" class="dg-box dg-fill-t"/><text x="619.0" y="252.5" class="dg-text dg-strong" text-anchor="middle">Pages</text><text x="619.0" y="269.5" class="dg-small" text-anchor="middle">10 routes</text><rect x="734" y="220" width="190" height="74" rx="4" class="dg-box "/><text x="829.0" y="252.5" class="dg-text dg-strong" text-anchor="middle">Data modules</text><text x="829.0" y="269.5" class="dg-small" text-anchor="middle">src/data/*.ts</text><polyline points="724.0,108 724.0,138" class="dg-line" marker-end="url(#ah-ba)"/><polyline points="619,190 619,220" class="dg-line" marker-end="url(#ah-ba)"/><polyline points="714,257.0 734,257.0" class="dg-line dg-dash" marker-end="url(#ah-ba)"/><rect x="701.0" y="235" width="46.0" height="16" class="dg-label-bg"/><text x="724" y="247" class="dg-small" text-anchor="middle">reads</text></svg>