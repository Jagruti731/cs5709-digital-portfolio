<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img"><title>Site scheme</title><style>.dg-box{fill:#F4F2EC;stroke:#1D1C19;stroke-width:1.4}.dg-box.dg-fill-a{fill:#DDE3D3;stroke:#3F5236}.dg-box.dg-fill-t{fill:#E7E4DC}.dg-box.dg-fill-i{fill:#1D1C19}.dg-box.dg-dashed{stroke-dasharray:5 4;fill:#F2F0EA}.dg-text{fill:#1D1C19;font:500 13.5px Georgia,'Times New Roman',serif}.dg-strong{font-weight:700}.dg-small{fill:#5F5C54;font:400 11.5px 'Courier New',monospace}.dg-on-ink{fill:#fff}.dg-line{fill:none;stroke:#5F5C54;stroke-width:1.5}.dg-dash{stroke-dasharray:5 4}.dg-arrowhead{fill:#5F5C54}.dg-label-bg{fill:#F4F2EC}.dg-group{fill:none;stroke:#BEB9AD;stroke-width:1.5;stroke-dasharray:4 4}.dg-group-label{fill:#3F5236;font:700 11px 'Courier New',monospace;letter-spacing:.05em}.dg-icon{fill:#F4F2EC;stroke:#1D1C19;stroke-width:1.1}</style><rect width="100%" height="100%" fill="#F4F2EC"/><defs><marker id="ah-map" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-arrowhead"/></marker></defs><rect x="390" y="16" width="180" height="54" rx="4" class="dg-box dg-fill-a"/><text x="480.0" y="38.5" class="dg-text dg-strong" text-anchor="middle">Home</text><text x="480.0" y="55.5" class="dg-small" text-anchor="middle">/</text><polyline points="480.0,70 480,100" class="dg-line"/><polyline points="74.0,100 886.0,100" class="dg-line"/><polyline points="74.0,100 74.0,124" class="dg-line" marker-end="url(#ah-map)"/><rect x="22" y="124" width="104" height="60" rx="4" class="dg-box dg-fill-t"/><text x="74.0" y="149.5" class="dg-text dg-strong" text-anchor="middle">About</text><text x="74.0" y="166.5" class="dg-small" text-anchor="middle">/about</text><polyline points="190.0,100 190.0,124" class="dg-line" marker-end="url(#ah-map)"/><rect x="138" y="124" width="104" height="60" rx="4" class="dg-box dg-fill-t"/><text x="190.0" y="149.5" class="dg-text dg-strong" text-a