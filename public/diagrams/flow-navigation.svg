<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img"><title>Control flow: navigation and rendering</title><style>.dg-box{fill:#F4F2EC;stroke:#1D1C19;stroke-width:1.4}.dg-box.dg-fill-a{fill:#DDE3D3;stroke:#3F5236}.dg-box.dg-fill-t{fill:#E7E4DC}.dg-box.dg-fill-i{fill:#1D1C19}.dg-box.dg-dashed{stroke-dasharray:5 4;fill:#F2F0EA}.dg-text{fill:#1D1C19;font:500 13.5px Georgia,'Times New Roman',serif}.dg-strong{font-weight:700}.dg-small{fill:#5F5C54;font:400 11.5px 'Courier New',monospace}.dg-on-ink{fill:#fff}.dg-line{fill:none;stroke:#5F5C54;stroke-width:1.5}.dg-dash{stroke-dasharray:5 4}.dg-arrowhead{fill:#5F5C54}.dg-label-bg{fill:#F4F2EC}.dg-group{fill:none;stroke:#BEB9AD;stroke-width:1.5;stroke-dasharray:4 4}.dg-group-label{fill:#3F5236;font:700 11px 'Courier New',monospace;letter-spacing:.05em}.dg-icon{fill:#F4F2EC;stroke:#1D1C19;stroke-width:1.1}</style><rect width="100%" height="100%" fill="#F4F2EC"/><defs><marker id="ah-nav" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-arrowhead"/></marker></defs><rect x="140.0" y="14.0" width="320" height="44" rx="22.0" class="dg-box dg-fill-i"/><text x="300" y="41" class="dg-text dg-on-ink dg-strong" text-anchor="middle">Visitor clicks a link in the Navbar</text><rect x="130" y="92" width="340" height="56" rx="4" class="dg-box "/><text x="300.0" y="115.5" class="dg-text dg-strong" text-anchor="middle">URL hash changes</text><text x="300.0" y="132.5" class="dg-small" text-anchor="middle">e.g. #/education (no page reload)</text><polygon points="300,170.0 420.0,212 300,254.0 180.0,212" class="dg-box dg-fill-a"/><text x="300" y="209" class="dg-text dg-strong" text-anchor="middle">Route in</text><text x="300" y="225" class="dg-text dg-strong" text-anchor="middle">routes.tsx?</text><rect x="580" y="184" width="300" height="56" rx="4" class="dg-box dg-fill-t"/><text x="730.0" y="207.5" class="dg-text dg-strong" text-anchor="middle">Render NotFound page</text><text x="730.0" y="224.5" class="dg-small" text-anchor="middle">links to Home and Readme</text><rect x="130" y="282" width="340" height="56" rx="4" class="dg-box "/><text x="300.0" y="305.5" class="dg-text dg-strong" text-anchor="middle">Layout renders</text><text x="300.0" y="322.5" class="dg-small" text-anchor="middle">Navbar · matched page (Outlet) · Footer</text><rect x="130" y="368" width="340" height="56" rx="4" class="dg-box "/><text x="300.0" y="391.5" class="dg-text dg-strong" text-anchor="middle">Layout effect</text><text x="300.0" y="408.5" class="dg-small" text-anchor="middle">set document title · scroll to top</text><rect x="130" y="454" width="340" height="56" rx="4" class="dg-box "/><text x="300.0" y="477.5" class="dg-text dg-strong" text-anchor="middle">Page reads its data</text><text x="300.0" y="494.5" class="dg-small" text-anchor="middle">data module, or Redux store for the feed</text><polygon points="300,530.0 430.0,572 300,614.0 170.0,572" class="dg-box dg-fill-a"/><text x="300" y="569" class="dg-text dg-strong" text-anchor="middle">URL has</text><text x="300" y="585" class="dg-text dg-strong" text-anchor="middle">?case=&lt;id&gt;?</text><rect x="580" y="544" width="300" height="56" rx="4" class="dg-box dg-fill-t"/><text x="730.0" y="567.5" class="dg-text dg-strong" text-anchor="middle">Scroll to that case study</text><text x="730.0" y="584.5" class="dg-small" text-anchor="middle">Professional Knowledge only</text><rect x="160.0" y="644.0" width="280" height="44" rx="22.0" class="dg-box dg-fill-i"/><text x="300" y="671" class="dg-text dg-on-ink dg-strong" text-anchor="middle">Page ready, wait for next click</text><polyline points="300,58.0 300.0,92" class="dg-line" marker-end="url(#ah-nav)"/><polyline points="300.0,148 300,170.0" class="dg-line" marker-end="url(#ah-nav)"/><polyline points="420.0,212 580,212.0" class="dg-line" marker-end="url(#ah-nav)"/><rect x="487.8" y="201.0" width="24.4" height="16" class="dg-label-bg"/><text x="500.0" y="213.0" class="dg-small" text-anchor="middle">no</text><polyline points="300,254.0 300.0,282" class="dg-line" marker-end="url(#ah-nav)"/><rect x="306.2" y="251" width="31.6" height="16" class="dg-label-bg"/><text x="322" y="263" class="dg-small" text-anchor="middle">yes</text><polyline points="300.0,338 300.0,368" class="dg-line" marker-end="url(#ah-nav)"/><polyline points="300.0,424 300.0,454" class="dg-line" marker-end="url(#ah-nav)"/><polyline points="300.0,510 300,530.0" class="dg-line" marker-end="url(#ah-nav)"/><polyline points="430.0,572 580,572.0" class="dg-line" marker-end="url(#ah-nav)"/><rect x="489.2" y="561.0" width="31.6" height="16" class="dg-label-bg"/><text x="505.0" y="573.0" class="dg-small" text-anchor="middle">yes</text><polyline points="300,614.0 300,644.0" class="dg-line" marker-end="url(#ah-nav)"/><rect x="307.8" y="619" width="24.4" height="16" class="dg-label-bg"/><text x="320" y="631" class="dg-small" text-anchor="middle">no</text><polyline points="730,600 730,666 440.0,666" class="dg-line" marker-end="url(#ah-nav)"/><polyline points="160.0,666 60,666 60,36 140.0,36" class="dg-line dg-dash" marker-end="url(#ah-nav)"/><rect x="19.0" y="339" width="82.0" height="16" class="dg-label-bg"/><text x="60" y="351" class="dg-small" text-anchor="middle">next click</text></svg>